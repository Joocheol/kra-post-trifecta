name: Build latest cultural PDF

on:
  push:
    branches:
      - agent/cultural-industry-revision
    paths:
      - '.github/workflows/build-latest-cultural-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cultural-industry-revision
      - name: Install PDF dependencies
        shell: bash
        run: |
          python -m pip install reportlab
          mkdir -p /tmp/kra-fonts
          cd /tmp/kra-fonts
          npm init -y >/dev/null 2>&1
          npm install \
            @expo-google-fonts/noto-serif-kr \
            @expo-google-fonts/noto-sans-kr
      - name: Build latest review PDFs
        run: python submission/cultural-industry/build-review-pdf.py
      - name: Verify PDFs
        shell: bash
        run: |
          test -s submission/cultural-industry/kra-cultural-industry-submission-author-review.pdf
          test -s submission/cultural-industry/kra-cultural-industry-submission-blind-review.pdf
          python - <<'PY'
          from pathlib import Path
          for p in [
              Path('submission/cultural-industry/kra-cultural-industry-submission-author-review.pdf'),
              Path('submission/cultural-industry/kra-cultural-industry-submission-blind-review.pdf'),
          ]:
              data=p.read_bytes()
              assert data.startswith(b'%PDF-') and b'%%EOF' in data[-4096:], p
              print(p, len(data))
          PY
      - name: Upload latest author PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cultural-industry-latest-pdf
          path: submission/cultural-industry/kra-cultural-industry-submission-author-review.pdf
          retention-days: 7
      - name: Commit PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/cultural-industry/kra-cultural-industry-submission-author-review.pdf \
                  submission/cultural-industry/kra-cultural-industry-submission-blind-review.pdf
          git commit -m 'Regenerate latest cultural-industry review PDFs' || exit 0
          git push origin HEAD:agent/cultural-industry-revision
