name: One-time referee revision patch

on:
  push:
    branches:
      - agent/cultural-industry-revision
    paths:
      - reviewer_patch_request.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: agent/cultural-industry-revision
          fetch-depth: 0

      - name: Apply referee-driven manuscript and diagnostic revisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manuscript_path = Path("submission/cultural-industry/manuscript.json")
          data = json.loads(manuscript_path.read_text(encoding="utf-8"))

          def section(prefix):
              return next(s for s in data["sections"] if s["heading"].startswith(prefix))

          def subsection(sec, prefix):
              return next(s for s in sec["subsections"] if s["heading"].startswith(prefix))

          # 15-16: source marking and restrained framing in the introduction.
          intro = section("I.")
          if "(한국마사회 2026)" not in intro["paragraphs"][0]:
              intro["paragraphs"][0] = intro["paragraphs"][0].replace(
                  "한국마사회는 2024년 6월 21일부터 전자마권(온라인마권) 발매를 정식 운영하여 이용자의 접근경로도 오프라인 경마장·장외발매소에서 모바일로 확대했다.",
                  "한국마사회는 2024년 6월 21일부터 전자마권(온라인마권) 발매를 정식 운영하였다(한국마사회 2026). 이에 따라 이용자의 접근경로도 오프라인 경마장·장외발매소에서 모바일로 확대됐다.",
              )
          if "(사행산업통합감독위원회 2023)" not in intro["paragraphs"][1]:
              intro["paragraphs"][1] = intro["paragraphs"][1].replace(
                  "사행산업통합감독위원회의 제4차 건전발전 종합계획(2024–2028)은",
                  "사행산업통합감독위원회의 제4차 건전발전 종합계획(2024–2028)은(사행산업통합감독위원회 2023)",
              )

          # 1: finite-pool benchmark.  Turnover/100 is deliberately not treated as
          # an identified independent sample size; report a transparent effective-N grid.
          methods = section("III.")
          distance = subsection(methods, "2.")
          finite_method = (
              "두 풀이 완전히 같은 잠재가격을 공유하더라도 유한한 베팅만 관측되면 TV는 0이 되지 않는다. "
              "이 표본변동의 척도를 보기 위해 동일한 잠재가격에서 두 풀이 서로 독립인 다항표본을 뽑는 기준을 추가한다. "
              "다만 경주–승식별 총매출을 100원으로 나눈 명목 투표단위 수는 반복구매와 연계된 조합선택을 포함하므로 통계적으로 독립인 시행 수와 같다고 볼 수 없다. "
              "따라서 유효표본크기 N을 1,000, 10,000, 100,000, 1,000,000으로 바꾸는 민감도 분석을 보고한다. "
              "이 기준은 0.05를 새로운 구조적 임계값으로 대체하기보다 관측 TV가 어느 정도의 유효 유동성에서 표본오차만으로 발생할 수 있는지 비교척도를 제공한다."
          )
          if not any("유효표본크기 N을 1,000" in p for p in distance["paragraphs"]):
              insert_at = next(
                  (i for i, p in enumerate(distance["paragraphs"]) if p.startswith("높은 차원의 삼쌍승")),
                  2,
              )
              distance["paragraphs"].insert(insert_at, finite_method)

          results = section("IV.")
          coherence = subsection(results, "1.")
          finite_result = (
              "유한 유동성 기준은 0.05라는 단일 문턱값에 추가적인 척도를 준다. 유효표본크기를 N=10,000으로 놓은 동일 잠재가격·독립 다항표본 기준의 중앙 TV는 "
              "쌍승 0.0393, 복승 0.0280, 삼복승 0.0420으로, 실제 삼쌍승 주변화 TV 0.0555, 0.0636, 0.0444의 각각 약 71%, 44%, 95%다. "
              "반대로 관측 TV와 같은 크기의 표본오차가 나오는 유효표본크기는 대략 쌍승 5천, 복승 2천, 삼복승 9천 수준이다. "
              "따라서 삼복승의 잔여 차이는 N=10,000 부근의 유한 유동성만으로도 거의 같은 크기가 될 수 있는 반면, 쌍승과 특히 복승은 같은 N에서 표본오차 기준보다 크다. "
              "그러나 총매출만으로 실제 독립 유효표본크기를 식별할 수 없으므로 이를 구조적 불일치의 검정으로 사용하지 않고 민감도 기준으로 해석한다."
          )
          if not any("유한 유동성 기준은 0.05" in p for p in coherence["paragraphs"]):
              coherence["paragraphs"].append(finite_result)

          revised_after = []
          for p in coherence["afterTable"]:
              p = p.replace("Jensen–Shannon 거리는", "Jensen–Shannon 발산은")
              if "분포형태의 상관계수도 각각" in p and "기계적으로 높아질" not in p:
                  p += " 다만 가격질량이 소수 인기조합에 집중된 벡터에서는 상관계수가 기계적으로 높아질 수 있으므로 이 수치는 보조적인 분포형태 점검으로만 해석한다."
              if p.startswith("연도와 경마장별로") and "2016–2019" not in p:
                  p += " 2016–2019와 2022–2025의 두 시기 블록에서도 각 블록을 구성하는 모든 연도에서 삼쌍승 주변화가 Harville보다 작아, 코로나 전후 자료의 결합이 순위를 뒤집은 것은 아니다."
              revised_after.append(p)
          coherence["afterTable"] = revised_after

          behavior = subsection(results, "3.")
          for i, p in enumerate(behavior["paragraphs"]):
              if p.startswith("행동모형의 결과는 더 제한적이다."):
                  behavior["paragraphs"][i] = (
                      "행동모형의 결과는 더 제한적이다. <표 4>의 M-S는 쌍승·복승에서는 M-S2, 삼쌍승·삼복승에서는 M-S3로, "
                      "각 승식에서 정의된 순차평가 변형을 뜻한다. 이 순차평가 모형은 결합확률을 한 번 평가하는 M-R보다 정확했지만, "
                      "네 승식 모두 단계조정 Harville보다 TV가 컸다. 짝지은 경주별 차이의 경주일 군집 bootstrap 구간도 모두 0 아래였다. "
                      "공통 확률지지 안의 조합만 사용하거나 실제 목표풀의 최저가격 10%를 제거해도 순위는 유지됐다."
                  )
          table4 = behavior["table"]
          if table4["headers"][3] == "순차 M-S":
              table4["headers"][3] = "순차 M-S(해당 변형)"
          if "공통 검증표본의 크기" not in table4["note"]:
              table4["note"] += " 경주 수는 각 행에서 단계조정 Harville과 M-S가 모두 계산 가능한 공통 검증표본의 크기다."

          # 11: explicit asynchronous-finalization limitation.
          implications = section("V.")
          for i, p in enumerate(implications["paragraphs"]):
              if p.startswith("연구에는 세 가지 한계가 있다."):
                  implications["paragraphs"][i] = p.replace("세 가지", "네 가지", 1)
          timing_limitation = (
              "넷째, 원자료는 승식별 최종배당의 확정시각을 동일한 시계열로 제공하지 않는다. 승식별 마감·확정시점이 서로 다르면 그 사이 유입된 정보가 교차풀 TV에 포함될 수 있다. "
              "따라서 잔여 차이의 일부가 시장가격의 불정합성보다 정보시점의 비동시성에서 생겼을 가능성을 배제할 수 없다. 배당 확정시각을 함께 공개해야 이 가능성을 직접 분리할 수 있다."
          )
          if not any(p.startswith("넷째, 원자료는 승식별 최종배당의 확정시각") for p in implications["paragraphs"]):
              implications["paragraphs"].append(timing_limitation)

          manuscript_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Keep the turnover-matched mechanical simulation ready for the newer
          # parser, while allowing the frozen GitHub sample (which predates the
          # turnover_won column) to reproduce the effective-N sensitivity benchmark.
          diag_path = Path("analysis/reviewer_diagnostics.py")
          diag = diag_path.read_text(encoding="utf-8")
          old = "    turnover = _turnover_frame(data_root, all_clean)\n\n    for market in TARGET_MARKETS:"
          new = (
              "    try:\n"
              "        turnover = _turnover_frame(data_root, all_clean)\n"
              "    except Exception as exc:\n"
              "        if \"turnover_won\" in str(exc):\n"
              "            return pd.DataFrame()\n"
              "        raise\n\n"
              "    for market in TARGET_MARKETS:"
          )
          if old in diag:
              diag = diag.replace(old, new, 1)
          diag_path.write_text(diag, encoding="utf-8")
          PY

      - name: Validate revised sources
        run: |
          python -m json.tool submission/cultural-industry/manuscript.json >/dev/null
          python -m py_compile analysis/reviewer_diagnostics.py

      - name: Commit patch and remove one-time trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/cultural-industry/manuscript.json analysis/reviewer_diagnostics.py
          git rm .github/workflows/reviewer-patch-once.yml reviewer_patch_request.txt
          git commit -m "Address final cultural-industry referee comments"
          git push origin HEAD:agent/cultural-industry-revision
