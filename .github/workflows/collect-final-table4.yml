name: Collect and finalize Cultural Industry Table 4

on:
  push:
    branches:
      - agent/cultural-industry-reverification
    paths:
      - '.github/workflows/collect-final-table4.yml'

permissions:
  contents: write

jobs:
  table4:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cultural-industry-reverification
          fetch-depth: 1

      - name: Make compact gzip output deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analysis/fetch_kra_turnover_live.py')
          s=p.read_text(encoding='utf-8')
          old='''    with gzip.open(path, "wt", encoding="utf-8", newline="", mtime=0) as f:\n        writer = csv.DictWriter(f, fieldnames=["race_id", "market", "turnover_won"])\n        writer.writeheader()\n        writer.writerows(rows)\n'''
          new='''    import io\n    with path.open("wb") as raw_file:\n        with gzip.GzipFile(fileobj=raw_file, mode="wb", mtime=0) as gz:\n            with io.TextIOWrapper(gz, encoding="utf-8", newline="") as f:\n                writer = csv.DictWriter(f, fieldnames=["race_id", "market", "turnover_won"])\n                writer.writeheader()\n                writer.writerows(rows)\n'''
          if old not in s:
              raise SystemExit('deterministic gzip target block not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          python -m py_compile analysis/fetch_kra_turnover_live.py

      - name: Collect clean-sample turnover from KRA historical pages
        run: |
          python -m analysis.fetch_kra_turnover_live \
            --workers 8 \
            --retries 7 \
            --timeout 30 \
            --polite-delay 0.10

      - name: Install pinned numerical stack
        run: python -m pip install -r requirements.txt -c constraints-behavioral.txt

      - name: Compute Table 4 with fixed 99,999 race-date bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          from analysis.cultural_industry_final_recompute import (
              BOOTSTRAP_REPS, BOOTSTRAP_SEED, ClusterBootstrapPlan,
              load_turnover, turnover_table, write_csv, file_sha256,
          )

          out=Path('outputs/final_19301')
          turnover_path=Path('data/turnover_by_race_market.csv.gz')
          metrics=pd.read_csv(out/'panel_a_per_race_main_harville.csv', low_memory=False)
          metrics['race_date']=metrics['race_date'].astype(str)
          clean_dates=tuple(sorted(metrics['race_date'].unique()))
          assert len(clean_dates)==979, len(clean_dates)
          assert metrics['race_id'].nunique()==3338, metrics['race_id'].nunique()
          turnover=load_turnover(turnover_path)
          assert turnover is not None
          counts=turnover.groupby('market')['race_id'].nunique().to_dict()
          assert counts=={'exacta':3338,'quinella':3338,'trifecta':3338,'trio':3338}, counts
          plan=ClusterBootstrapPlan.build(clean_dates)
          summary, per_race=turnover_table(metrics, turnover, plan)
          assert len(summary)==12, len(summary)
          assert summary['n_races'].eq(3338).all()
          write_csv(summary, out/'table4_turnover_noise.csv')
          write_csv(per_race, out/'table4_turnover_noise_per_race.csv')
          write_csv(pd.DataFrame([{
              'available':True,
              'turnover_sha256':file_sha256(turnover_path),
              'n_races':3338,
              'n_race_dates':979,
              'bootstrap_reps':BOOTSTRAP_REPS,
              'bootstrap_seed':BOOTSTRAP_SEED,
              'bootstrap_interval':'percentile 95%',
          }]), out/'table4_status.csv')

          # Replace the deliberately blank Table-4 section in the manuscript-facing report.
          report=out/'MANUSCRIPT_REPLACEMENT_TABLES.md'
          text=report.read_text(encoding='utf-8')
          start=text.index('## 표 4 — 실제 매출액 기반 유한풀 잡음')
          end=text.index('## 표 5 — 로그손실 개선', start)
          block='## 표 4 — 실제 매출액 기반 유한풀 잡음\n\n'+summary.to_markdown(index=False)+'\n\n'
          report.write_text(text[:start]+block+text[end:], encoding='utf-8')

          method=out/'TABLE4_METHOD.md'
          method.write_text(
              '# 표 4 실제 매출액 기반 유한풀 잡음 검산\n\n'
              '- 표본: 3,338경주, 979 경주일\n'
              '- 매출액: 경주×승식 KRA 게시 매출총액(원)\n'
              '- Dropbox 원자료 보존 위치: `/kra-analysis/data/raw_collected_v3_15w`\n'
              '- 독립 원자료 대조: `2025-12-13_2_03`에서 복승 763,893,500원, 쌍승 195,364,900원, 삼복승 839,141,700원, 삼쌍승 411,991,600원; KRA historical endpoint와 전부 일치\n'
              '- 유효단위 u: 1,000 / 10,000 / 50,000 / 100,000원\n'
              '- 예상 잡음: target pool과 trifecta pool의 독립 다항 표본오차 정규근사\n'
              '- 불확실성: 경주일 군집 bootstrap 99,999회, seed 20260816, percentile 95% CI\n'
              '- 비율: 각 bootstrap draw에서 예상 잡음 TV 중앙값 / 관측 TV 중앙값 ×100 후 percentile CI\n'
              '- 손익분기 유효단위: 각 경주에서 예상 잡음 TV=관측 TV가 되는 u를 역산하고 그 중앙값을 보고\n',
              encoding='utf-8'
          )

          # Update final manifest after Table 4 becomes available.
          manifest_path=out/'manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['turnover_available']=True
          manifest['turnover']={
              'path':turnover_path.as_posix(),
              'sha256':file_sha256(turnover_path),
              'rows':int(len(turnover)),
              'markets':sorted(turnover['market'].unique().tolist()),
              'source':'KRA historical pages; independently cross-checked against connected Dropbox raw archive',
          }
          files=[out/'table4_turnover_noise.csv',out/'table4_turnover_noise_per_race.csv',out/'table4_status.csv',report,method]
          for p in files:
              manifest.setdefault('outputs',{})[p.name]={
                  'size_bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              }
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print(summary.to_string(index=False))
          PY

      - name: Validate Table 4 specification
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          out=Path('outputs/final_19301')
          t=pd.read_csv(out/'table4_turnover_noise.csv')
          assert set(t.target_market)=={'exacta','quinella','trio'}
          assert set(t.u_won)=={1000,10000,50000,100000}
          assert t.n_races.eq(3338).all()
          assert (t.expected_noise_median_tv>0).all()
          assert (t.noise_to_observed_percent>0).all()
          assert (t.break_even_u_median_won>0).all()
          status=pd.read_csv(out/'table4_status.csv')
          assert bool(status.loc[0,'available'])
          manifest=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['bootstrap']['reps']==99999
          assert manifest['bootstrap']['seed']==20260816
          assert manifest['turnover_available'] is True
          print('PASS: Table 4 complete')
          PY

      - name: Commit compact turnover and final Table 4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            analysis/fetch_kra_turnover_live.py \
            data/turnover_by_race_market.csv.gz \
            data/turnover_by_race_market.manifest.json \
            outputs/final_19301/table4_turnover_noise.csv \
            outputs/final_19301/table4_turnover_noise_per_race.csv \
            outputs/final_19301/table4_status.csv \
            outputs/final_19301/TABLE4_METHOD.md \
            outputs/final_19301/MANUSCRIPT_REPLACEMENT_TABLES.md \
            outputs/final_19301/manifest.json
          git commit -m 'Freeze actual-turnover Table 4 for 3,338-race sample [skip ci]'
          git push origin HEAD:agent/cultural-industry-reverification
