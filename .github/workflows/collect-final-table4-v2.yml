name: Collect and finalize Cultural Industry Table 4 v2
on:
  push:
    branches: [agent/cultural-industry-reverification]
    paths: ['.github/workflows/collect-final-table4-v2.yml']
permissions:
  contents: write
jobs:
  table4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cultural-industry-reverification
          fetch-depth: 1
      - name: Collect 3,338 race turnovers, one KRA detail page per race
        run: python -m analysis.fetch_kra_turnover_live --workers 12 --retries 7 --timeout 30 --polite-delay 0.10
      - name: Install pinned numerical stack
        run: python -m pip install -r requirements.txt -c constraints-behavioral.txt
      - name: Compute fixed-specification Table 4
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          from analysis.cultural_industry_final_recompute import BOOTSTRAP_REPS,BOOTSTRAP_SEED,ClusterBootstrapPlan,load_turnover,turnover_table,write_csv,file_sha256
          out=Path('outputs/final_19301'); src=Path('data/turnover_by_race_market.csv.gz')
          metrics=pd.read_csv(out/'panel_a_per_race_main_harville.csv',low_memory=False)
          metrics['race_date']=metrics['race_date'].astype(str)
          dates=tuple(sorted(metrics['race_date'].unique()))
          assert metrics.race_id.nunique()==3338 and len(dates)==979
          turnover=load_turnover(src); assert turnover is not None
          counts=turnover.groupby('market').race_id.nunique().to_dict()
          assert counts=={'exacta':3338,'quinella':3338,'trifecta':3338,'trio':3338},counts
          summary,per_race=turnover_table(metrics,turnover,ClusterBootstrapPlan.build(dates))
          assert len(summary)==12 and summary.n_races.eq(3338).all()
          write_csv(summary,out/'table4_turnover_noise.csv'); write_csv(per_race,out/'table4_turnover_noise_per_race.csv')
          write_csv(pd.DataFrame([{'available':True,'turnover_sha256':file_sha256(src),'n_races':3338,'n_race_dates':979,'bootstrap_reps':BOOTSTRAP_REPS,'bootstrap_seed':BOOTSTRAP_SEED,'bootstrap_interval':'percentile 95%'}]),out/'table4_status.csv')
          report=out/'MANUSCRIPT_REPLACEMENT_TABLES.md'; text=report.read_text(encoding='utf-8')
          a=text.index('## 표 4 — 실제 매출액 기반 유한풀 잡음'); b=text.index('## 표 5 — 로그손실 개선',a)
          report.write_text(text[:a]+'## 표 4 — 실제 매출액 기반 유한풀 잡음\n\n'+summary.to_markdown(index=False)+'\n\n'+text[b:],encoding='utf-8')
          method=out/'TABLE4_METHOD.md'
          method.write_text('# 표 4 실제 매출액 기반 유한풀 잡음 검산\n\n- 표본: 3,338경주, 979 경주일\n- 원자료 보존: connected Dropbox `/kra-analysis/data/raw_collected_v3_15w`\n- 원자료 대조: 2025-12-13_2_03의 복승 763,893,500원, 쌍승 195,364,900원, 삼복승 839,141,700원, 삼쌍승 411,991,600원이 KRA 상세 성적표와 일치\n- compact 자료: 경주×승식 `turnover_won`, 3,338×4=13,352행\n- u: 1,000/10,000/50,000/100,000원\n- 잡음식: 동일 잠재가격 아래 두 독립 다항 풀의 정규근사\n- CI: 경주일 군집 bootstrap 99,999회, seed 20260816, percentile 95%\n- 비율: 미반올림 bootstrap draw에서 예상 잡음 TV/관측 TV×100\n- 손익분기 u: 예상 잡음 TV=관측 TV가 되는 유효 베팅단위의 경주별 역산 중앙값\n',encoding='utf-8')
          manifest_path=out/'manifest.json'; manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['turnover_available']=True; manifest['turnover']={'path':src.as_posix(),'sha256':file_sha256(src),'rows':len(turnover),'markets':sorted(turnover.market.unique()),'source':'KRA historical detail pages cross-checked against connected Dropbox raw archive'}
          for p in [out/'table4_turnover_noise.csv',out/'table4_turnover_noise_per_race.csv',out/'table4_status.csv',report,method]:
              manifest.setdefault('outputs',{})[p.name]={'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(summary.to_string(index=False))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          o=Path('outputs/final_19301'); t=pd.read_csv(o/'table4_turnover_noise.csv')
          assert set(t.target_market)=={'exacta','quinella','trio'} and set(t.u_won)=={1000,10000,50000,100000}
          assert t.n_races.eq(3338).all() and (t.expected_noise_median_tv>0).all() and (t.break_even_u_median_won>0).all()
          m=json.loads((o/'manifest.json').read_text()); assert m['bootstrap']['reps']==99999 and m['bootstrap']['seed']==20260816 and m['turnover_available'] is True
          print('PASS: final actual-turnover Table 4')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/fetch_kra_turnover_live.py data/turnover_by_race_market.csv.gz data/turnover_by_race_market.manifest.json outputs/final_19301/table4_turnover_noise.csv outputs/final_19301/table4_turnover_noise_per_race.csv outputs/final_19301/table4_status.csv outputs/final_19301/TABLE4_METHOD.md outputs/final_19301/MANUSCRIPT_REPLACEMENT_TABLES.md outputs/final_19301/manifest.json
          git commit -m 'Freeze actual-turnover Table 4 for 3,338-race sample [skip ci]'
          git push origin HEAD:agent/cultural-industry-reverification
