name: Export final clean race ids

on:
  push:
    branches:
      - agent/cultural-industry-reverification
    paths:
      - '.github/workflows/export-clean-race-ids.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cultural-industry-reverification
          fetch-depth: 1
      - name: Export clean race IDs
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('outputs/final_19301/panel_a_per_race_main_harville.csv')
          with p.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              ids = sorted({row['race_id'] for row in reader})
          assert len(ids) == 3338, len(ids)
          out = Path('outputs/final_19301/clean_race_ids.txt')
          out.write_text('\n'.join(ids) + '\n', encoding='utf-8')
          print('clean_races', len(ids))
          PY
      - name: Commit clean race IDs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/final_19301/clean_race_ids.txt
          git commit -m 'Freeze clean race IDs for turnover retrieval [skip ci]'
          git push origin HEAD:agent/cultural-industry-reverification
