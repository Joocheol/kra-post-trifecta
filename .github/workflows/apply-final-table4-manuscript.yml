name: Apply final Table 4 to cultural manuscript

on:
  push:
    branches:
      - agent/cultural-industry-reverification
    paths:
      - '.github/workflows/apply-final-table4-manuscript.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cultural-industry-reverification

      - name: Replace pre-turnover sensitivity prose with final actual-turnover results
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('submission/cultural-industry/manuscript.json')
          doc = json.loads(path.read_text(encoding='utf-8'))

          data_replacement = (
              '경주–승식별 총매출도 관측된다. 한국마사회 원자료에서 원 단위 매출총액을 추출해 '
              '경주×승식 compact 집계파일의 turnover_won으로 보존했다. 최종 점표본 3,338개 경주에 '
              '대해서는 쌍승·복승·삼복승·삼쌍승 네 승식의 매출총액 13,352개 경주–승식 관측치가 모두 '
              '확보되어 있다. 다만 총매출을 최소 구매단위로 단순히 나눈 값이 곧 통계적으로 독립인 '
              '베팅건수는 아니다. 같은 이용자가 여러 번 구매하거나 여러 조합을 함께 선택할 수 있기 '
              '때문이다. 따라서 총매출은 유동성 잡음의 크기를 점검하는 데 사용하되, 독립 베팅건수 자체를 '
              '직접 관측한 것으로 해석하지 않는다.'
          )

          liquidity_paragraphs = [
              '9,999.9로 표시된 배당을 실제 배당이 정확히 9,999.9라고 가정하면 결과가 지나치게 단정적일 수 있다. 그래서 전체표본에서는 정확한 값 하나를 억지로 정하지 않는다. 반올림 규칙과 표시상한에 맞는 모든 가능한 가격을 허용한 뒤, 두 가격표의 차이가 최소한 얼마이고 보수적으로 최대 얼마까지 될 수 있는지를 계산한다. 통계학에서는 이런 접근을 부분식별이라고 부르지만, 여기서는 ‘가능한 가격범위를 그대로 남기는 방법’으로 이해하면 충분하다.',
              '쉽게 말하면 비상한 표본에서는 ‘차이가 0.06이다’라고 말할 수 있지만, 표시상한이 있는 경주에서는 ‘자료가 허용하는 차이는 0.05에서 0.07 사이에 있다’고 말한다. 본문의 최대값은 가능한 각 성분의 불확실성을 보수적으로 합한 보수적 상한(outer bound)이므로 실제 최대차이보다 넓을 수 있다. 특히 삼복승처럼 0.05 근처에서 판단이 갈리는 경우에는 이 점을 결론에 그대로 반영한다.',
              '관측된 TV 가운데 얼마가 유한한 베팅규모에서 생길 수 있는지도 실제 승식별 총매출을 이용해 점검한다. 두 풀이 같은 잠재가격을 공유한다고 놓고, 한 개의 통계적으로 독립적인 유효 베팅단위를 u원이라고 하면 각 풀의 유효 추출횟수는 총매출을 u로 나눈 값이 된다. 이를 바탕으로 두 독립 다항 풀의 정상근사에서 예상되는 TV 잡음을 계산했다. u는 실제 평균 베팅액의 추정치가 아니라 독립적인 정보단위의 크기를 바꾸어 보는 민감도 모수이며, 본문에서는 1만원·5만원·10만원을 제시한다.',
              '3,338개 점표본에서 관측 TV 중앙값은 쌍승 0.0555, 복승 0.0637, 삼복승 0.0444다. u=1만원일 때 예상 잡음 TV 중앙값은 각각 0.0230, 0.0127, 0.0191로 관측 TV의 41.5%, 20.0%, 43.0%다. u=5만원이면 92.7%, 44.7%, 96.3%이고, u=10만원이면 131.1%, 63.2%, 136.1%다. 예상 잡음이 관측 TV와 같아지는 손익분기 유효단위의 중앙값은 쌍승 약 5.64만원, 복승 약 24.83만원, 삼복승 약 5.38만원이다. 따라서 쌍승과 삼복승의 잔여 차이는 비교적 큰 유효단위를 가정하면 유동성 잡음과 비슷한 규모가 될 수 있지만, 복승은 같은 가정에서도 관측 차이가 더 크게 남는다. 다만 u 자체를 직접 관측하지 못하므로 이 계산을 잔여 차이의 구조적 분해로 해석하지 않는다.'
          ]

          data_done = False
          liquidity_done = False
          for section in doc.get('sections', []):
              for subsection in section.get('subsections', []):
                  if subsection.get('heading') == '3. 자료와 분석표본':
                      paragraphs = subsection.get('paragraphs', [])
                      for i, text in enumerate(paragraphs):
                          if text.startswith('경주–승식별 총매출도 관측된다.'):
                              paragraphs[i] = data_replacement
                              data_done = True
                  if subsection.get('heading') == '3. 반올림·표시상한과 유한한 유동성':
                      subsection['paragraphs'] = liquidity_paragraphs
                      liquidity_done = True

          if not data_done:
              raise SystemExit('data turnover paragraph target not found')
          if not liquidity_done:
              raise SystemExit('liquidity subsection target not found')

          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JSON and final sample markers
        shell: bash
        run: |
          python -m json.tool submission/cultural-industry/manuscript.json >/dev/null
          grep -q '3,338개 점표본' submission/cultural-industry/manuscript.json
          grep -q '131.1%' submission/cultural-industry/manuscript.json
          grep -q '2483' /dev/null && exit 1 || true

      - name: Commit manuscript source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/cultural-industry/manuscript.json
          git commit -m 'Apply final actual-turnover Table 4 to cultural manuscript' || exit 0
          git push origin HEAD:agent/cultural-industry-reverification
