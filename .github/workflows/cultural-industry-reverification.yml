name: Cultural-industry independent reverification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cultural-industry-reverification
    paths:
      - 'analysis/cultural_industry_reverification.py'
      - 'tests/test_cultural_industry_reverification.py'
      - '.github/workflows/cultural-industry-reverification.yml'

permissions:
  contents: write

jobs:
  reverification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cultural-industry-reverification
          fetch-depth: 1

      - name: Install pinned numerical stack
        run: python -m pip install -r requirements.txt -c constraints-behavioral.txt

      - name: Run focused unit tests
        run: python -m unittest tests.test_cultural_industry_reverification -v

      - name: Run independent recomputation
        run: python -m analysis.cultural_industry_reverification

      - name: Sanity-check generated records
        shell: bash
        run: |
          test -s outputs/cultural_industry_reverification_summary.csv
          test -s outputs/cultural_industry_reverification_per_race.csv
          test -s outputs/cultural_industry_reverification_sample.csv
          test -s outputs/cultural_industry_2018_overcap_check.csv
          test -s outputs/cultural_industry_reverification_input_files.csv
          test -s outputs/cultural_industry_reverification_manifest.json
          test -s submission/cultural-industry/REVERIFICATION_2026-08-16.md
          python - <<'PY'
          import pandas as pd
          s = pd.read_csv('outputs/cultural_industry_reverification_summary.csv')
          assert len(s) == 8, s
          assert s['tracked_matches'].fillna(False).all(), s
          a = pd.read_csv('outputs/cultural_industry_reverification_sample.csv')
          assert a['candidate_in_scope_races'].nunique() == 1
          assert a['clean_races'].nunique() == 1
          print(s.to_string(index=False))
          print(a.to_string(index=False))
          PY

      - name: Commit reproducibility record
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            outputs/cultural_industry_reverification_summary.csv \
            outputs/cultural_industry_reverification_per_race.csv \
            outputs/cultural_industry_reverification_sample.csv \
            outputs/cultural_industry_2018_overcap_check.csv \
            outputs/cultural_industry_turnover_limit_summary.csv \
            outputs/cultural_industry_turnover_null_summary.csv \
            outputs/cultural_industry_turnover_null_per_race.csv \
            outputs/cultural_industry_reverification_input_files.csv \
            outputs/cultural_industry_reverification_manifest.json \
            submission/cultural-industry/REVERIFICATION_2026-08-16.md
          git commit -m 'Freeze independent cultural-industry reverification [skip ci]' || exit 0
          git push origin HEAD:agent/cultural-industry-reverification
