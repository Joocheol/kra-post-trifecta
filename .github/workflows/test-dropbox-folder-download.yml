name: Test Dropbox raw archive download

on:
  push:
    branches:
      - agent/cultural-industry-reverification
    paths:
      - '.github/workflows/test-dropbox-folder-download.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test first bytes of raw archive folder download
        shell: bash
        env:
          DROPBOX_FOLDER_URL: 'https://www.dropbox.com/scl/fo/zfq4qwfom2gzg640nlj05/h?rlkey=xunwlfus1e3e9h2ggvxylb6n0&dl=1'
        run: |
          set -euo pipefail
          curl -L --fail --range 0-4095 --max-time 60 -o /tmp/probe.bin "$DROPBOX_FOLDER_URL"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/probe.bin')
          print('bytes', p.stat().st_size)
          print('head', p.read_bytes()[:16].hex())
          PY
