name: Diagnose 2018 over-cap races

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cultural-industry-revision
    paths:
      - '.github/workflows/diagnose-2018-overcap.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python -m pip install -r requirements.txt -c constraints-behavioral.txt
      - name: Inspect 2018-07-01 and counterfactual sample
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import pyarrow.parquet as pq
          import json
          from analysis import data_audit

          root = Path('KRA/parsed')
          markets = ['win','exacta','quinella','trio','trifecta']
          rows=[]
          for market in markets:
              paths=sorted(root.glob(f'*/market={market}/year=*/month=*/part-*.parquet'))
              frame=pq.read_table(paths).to_pandas()
              d=frame[frame['race_date'].astype(str).eq('2018-07-01')].copy()
              odds=pd.to_numeric(d['odds'], errors='coerce')
              stored=d['is_capped_odds'].fillna(False).astype(bool)
              rows.append({
                  'market':market,
                  'rows':len(d),
                  'races':d['race_id'].nunique(),
                  'odds_eq_9999_9':int((odds==9999.9).sum()),
                  'odds_gt_9999_9':int((odds>9999.9).sum()),
                  'stored_capped':int(stored.sum()),
                  'max_odds':float(odds.max()),
              })
          pd.DataFrame(rows).to_csv('/tmp/overcap_summary.csv', index=False)

          # Counterfactual audit: include the date and treat only exact 9999.9 displays as censored.
          data_audit.EXCLUDED_DATES=frozenset()
          original=data_audit.audit_market
          # Patch audit_market source semantics through temporary parquet copies is unnecessary;
          # produce race-level canonical cap counts directly and report structural eligibility.
          races=data_audit.prepare_races(root)
          date_races=races[races['race_date'].astype(str).eq('2018-07-01')]
          out={'date_races':int(len(date_races)), 'race_ids':date_races['race_id'].tolist()}
          Path('/tmp/date_races.json').write_text(json.dumps(out, ensure_ascii=False, indent=2))
          print(pd.DataFrame(rows).to_string(index=False))
          print(json.dumps(out, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-2018-overcap
          path: |
            /tmp/overcap_summary.csv
            /tmp/date_races.json
          retention-days: 7
